<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>___TOSO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="wrapper">

  <!-- MENU -->
  <nav id="nav" class="nav gray">
    <div class="logo">___TOSO</div>

    <div class="menu">
      <a data-route="home" class="active">home</a>
      <a data-route="ads">products & advertising</a>
      <a data-route="people">people & fashion</a>
      <a data-route="personal">personal work</a>
      <a data-route="bio">bio</a>
      <a data-route="contact">contact</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <main id="content" class="content theme-gray">

    <!-- HOME -->
    <section id="home" class="page active">
      <div class="home">
        <img src="/assets/img/home/home01.jpg" class="active" alt="">
        <img src="/assets/img/home/home02.jpg" alt="">
        <img src="/assets/img/home/home03.jpg" alt="">
        <img src="/assets/img/home/home04.jpg" alt="">
      </div>
    </section>

    <!-- ADS -->
    <section id="ads" class="page">
      <div class="section">

        <div class="section-text">
          Products & Advertising
        </div>

        <div class="project-list">

          <!-- PROJETO 1 -->
          <div class="project" data-project="theordinary" data-title="The Ordinary · Advertising">
            <img src="/assets/img/ads/ads-theordinary-1.jpg" alt="">
            <img src="/assets/img/ads/ads-theordinary-2.jpg" alt="">
            <img src="/assets/img/ads/ads-theordinary-3.jpg" alt="">
            <img src="/assets/img/ads/ads-theordinary-4.jpg" alt="">
            <img src="/assets/img/ads/ads-theordinary-5.jpg" alt="">
          </div>

          <!-- PROJETO 2 -->
          <div class="project" data-project="perfumes" data-title="Perfumaria · Vogue">
            <img src="/assets/img/ads/ads-perfumes-1.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-2.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-3.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-4.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-5.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-6.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-7.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-8.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-9.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-10.jpg" alt="">
            <img src="/assets/img/ads/ads-perfumes-11.jpg" alt="">
          </div>

        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery" class="page">
      <div class="gallery">

        <div class="viewer">
          <button class="nav-arrow prev">‹</button>
          <img id="mainImage" src="" alt="">
          <button class="nav-arrow next">›</button>
        </div>

        <div class="gallery-thumbs" id="galleryThumbs"></div>

      </div>
    </section>

    <!-- PEOPLE -->
    <section id="people" class="page">
      <div class="section">
        <div class="section-text">People & Fashion</div>
        <div class="project-list"></div>
      </div>
    </section>

    <!-- PERSONAL -->
    <section id="personal" class="page">
      <div class="section">
        <div class="section-text">Personal work</div>
        <div class="project-list"></div>
      </div>
    </section>

    <!-- BIO -->
    <section id="bio" class="page">
      <div class="text">Bio text goes here.</div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="page">
      <div class="text">studio@toso.studio</div>
    </section>

  </main>
</div>

<script src="/assets/js/main.js"></script>
</body>
</html>
