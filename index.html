<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>___TOSO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="wrapper">
    <nav id="nav" class="nav gray" aria-label="Primary">
      <div class="logo">___TOSO</div>

      <div class="menu" role="navigation">
        <a href="#home" data-route="home" class="active">home</a>
        <a href="#ads" data-route="ads">advertising</a>
        <a href="#people" data-route="people">people & fashion</a>
        <a href="#personal" data-route="personal">personal work</a>
        <a href="#bio" data-route="bio">bio</a>
        <a href="#contact" data-route="contact">contact</a>
      </div>
    </nav>

    <main id="content" class="content theme-gray">
      <!-- HOME -->
      <section id="home" class="page active" data-page>
        <div class="home" aria-label="Home slideshow">
          <img src="https://picsum.photos/1400/900?1" class="active" alt="">
          <img src="https://picsum.photos/1400/900?2" alt="">
          <img src="https://picsum.photos/1400/900?3" alt="">
        </div>
      </section>

      <!-- ADS -->
      <section id="ads" class="page" data-page>
        <div class="section">
          <div class="section-text">Melissa · Nike · Adidas · Zara</div>
          <div class="project-list">
            <img src="https://picsum.photos/600/400?4" alt="" data-open="gallery">
          </div>
        </div>
      </section>

      <!-- PEOPLE -->
      <section id="people" class="page" data-page>
        <div class="section">
          <div class="section-text">Vogue · GQ · Harper’s Bazaar</div>
          <div class="project-list">
            <img src="https://picsum.photos/600/400?5" alt="" data-open="gallery">
          </div>
        </div>
      </section>

      <!-- PERSONAL -->
      <section id="personal" class="page" data-page>
        <div class="section">
          <div class="section-text">Personal projects</div>
          <div class="project-list">
            <img src="https://picsum.photos/600/400?6" alt="" data-open="gallery">
          </div>
        </div>
      </section>

      <!-- GALLERY -->
      <section id="gallery" class="page" data-page>
        <div class="gallery">
          <div class="viewer">
            <img id="mainImage" src="https://picsum.photos/1400/900?7" alt="">
          </div>

          <div class="gallery-thumbs" aria-label="Gallery thumbnails">
            <img src="https://picsum.photos/400/300?7" class="active" alt="" data-swap>
            <img src="https://picsum.photos/400/300?8" alt="" data-swap>
            <img src="https://picsum.photos/400/300?9" alt="" data-swap>
          </div>
        </div>
      </section>

      <!-- BIO -->
      <section id="bio" class="page" data-page>
        <div class="text">Bio text</div>
      </section>

      <!-- CONTACT -->
      <section id="contact" class="page" data-page>
        <div class="text">studio@toso.com</div>
      </section>
    </main>
  </div>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
