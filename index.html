<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>___TOSO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/style.css">

</head>
<body>

<div class="wrapper">

  <!-- MENU -->
  <nav id="nav" class="nav gray">
    <div class="logo">___TOSO</div>

    <div class="menu">
      <a data-route="home" class="active">home</a>
      <a data-route="ads">products & advertising</a>
      <a data-route="people">people & fashion</a>
      <a data-route="personal">personal work</a>
      <a data-route="bio">bio</a>
      <a data-route="contact">contact</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <main id="content" class="content theme-gray">

    <!-- HOME -->
    <section id="home" class="page active">
      <div class="home" aria-label="Home slideshow">
        <img src="/assets/img/home/home01.jpg" class="active" alt="">
        <img src="/assets/img/home/home02.jpg" alt="">
        <img src="/assets/img/home/home03.jpg" alt="">
        <img src="/assets/img/home/home04.jpg" alt="">
      </div>
    </section>

    <!-- PRODUCTS & ADVERTISING -->
    <section id="ads" class="page">
      <div class="section">
        <div class="section-text">
          The Ordinary · Advertising
        </div>

        <div class="project-list">
          <img
            src="/assets/img/ads/ads-theordinary-1.jpg"
            data-project="ads-theordinary"
            alt="The Ordinary — Advertising">
        </div>
      </div>
    </section>

    <!-- PEOPLE & FASHION -->
    <section id="people" class="page">
      <div class="section">
        <div class="section-text">
          People & Fashion
        </div>

        <div class="project-list">
          <!-- pronto para futuros projetos -->
        </div>
      </div>
    </section>

    <!-- PERSONAL WORK -->
    <section id="personal" class="page">
      <div class="section">
        <div class="section-text">
          Personal work
        </div>

        <div class="project-list">
          <!-- pronto para futuros projetos -->
        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery" class="page">
      <div class="gallery">

        <div class="viewer">
          <img id="mainImage" src="" alt="Project image">

          <div class="gallery-nav">
            <button class="prev" aria-label="Previous image">‹</button>
            <button class="next" aria-label="Next image">›</button>
          </div>
        </div>

        <div class="gallery-thumbs" id="galleryThumbs"></div>

      </div>
    </section>

    <!-- BIO -->
    <section id="bio" class="page">
      <div class="text">
        Bio text goes here.  
        Short, editorial, minimal.
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="page">
      <div class="text">
        studio@toso.studio
      </div>
    </section>

  </main>

</div>

<!-- JS -->
<script src="/assets/js/main.js"></script>

</body>
</html>
